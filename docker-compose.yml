# Explicit name: Cyrillic folder «ПСБ» yields empty default project name.
name: psb

services:
  answer:
    build:
      context: .
      dockerfile: apps/answer-core/Dockerfile
    ports:
      - "8090:8090"
    environment:
      PSB_KB_PATH: /data/fixtures/kb.jsonl
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_LEGAL_API_URL: ${NEXT_PUBLIC_LEGAL_API_URL:-http://localhost:8090}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8090/api/v1}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_LEGAL_API_URL: ${NEXT_PUBLIC_LEGAL_API_URL:-http://localhost:8090}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8090/api/v1}
    depends_on:
      - answer
    restart: unless-stopped

  # Legacy stub API (optional profile)
  api:
    profiles: ["legacy"]
    build: ./apps/api
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DEMO_TOKEN: ${DEMO_TOKEN:-demo-masha-token}
      DEMO_OFFLINE: ${DEMO_OFFLINE:-1}
      USE_MEMORY_STORE: "1"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    profiles: ["full"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["full"]

volumes:
  uploads:
  pgdata:
