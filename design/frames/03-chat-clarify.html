<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frame — clarify</title>
  <style>
    :root {
      --bg: #f4f6f8; --surface: #fff; --ink: #1a2332; --muted: #5c6b7a;
      --line: #d8e0e8; --accent: #0b6e4f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    .shell { max-width: 720px; margin: 40px auto; padding: 0 16px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; }
    .meta { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
    p { line-height: 1.5; }
    .opts { display: grid; gap: 8px; margin-top: 14px; }
    .opts button {
      text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
      background: #fbfcfd; font: inherit; cursor: pointer;
    }
    .opts button:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="meta">status: clarify</div>
      <p>Уточните, пожалуйста, о каком договоре и периоде речь — без этого поиск по базе даст неоднозначный результат.</p>
      <div class="opts">
        <button type="button">Договор с контрагентом А · текущая редакция</button>
        <button type="button">Тот же договор · с учётом доп. соглашения</button>
        <button type="button">Внутренний регламент согласования (без конкретного договора)</button>
      </div>
    </div>
  </div>
</body>
</html>
